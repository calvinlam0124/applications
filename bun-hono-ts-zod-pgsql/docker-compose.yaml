services:
  app:
    build: .
    ports:
      - 3000:3000
    volumes:
      - .:/app

  db:
    image: postgres:16.1-bullseye
    ports:
      - 5432:5432
    command: postgres -c 'max_connections=4'
    #        sql: show max_connections;
    #        sql: SELECT sum(numbackends) FROM pg_stat_database;
    #        show superuser_reserved_connections; //https://www.dbi-services.com/blog/postgresql-16-reserved_connections/
    environment:
      - POSTGRES_PASSWORD=123456!
      - POSTGRES_USER=db_user
      - POSTGRES_DB=db_name
    volumes:
      - ./pg-data:/var/lib/postgresql/data
#      - ./migration/prisma/migrations/20240115085101_init/migration.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h /var/run/postgresql" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # PROFILE: migration
  # docker compose --profile migration -f docker-compose.dev.yaml up
  #  db-migration:
  #    profiles:
  #      - migration
  #    image: node:20.8.0-bookworm
  #    working_dir: /app
  #    volumes:
  #      - ./src:/app
  #    command:
  #      - "npx"
  #      - "sequelize-cli"
  #      #      - "db:migrate:status"
  #      - "db:migrate"
  #      - "--url"
  #      - "'mysql://root:123456!@host.docker.internal/db_name'"
  #    extra_hosts:
  #      - "host.docker.internal:host-gateway"
  #    depends_on:
  #      db:
  #        condition: service_healthy


  # env-doc: https://github.com/edoburu/docker-pgbouncer?tab=readme-ov-file#configuration
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DB_USER=db_user
      - DB_PASSWORD=123456!
      - DB_HOST=db
      # - DB_NAME=db_name
      - AUTH_TYPE=scram-sha-256 # remove/comment this line if using postgres:13 and lower
      - POOL_MODE=transaction
      - ADMIN_USERS=postgres,dbuser
      - "MAX_CLIENT_CONN=4"
      - "DEFAULT_POOL_SIZE=2"
    ports:
      - "5433:5432"
    depends_on:
      - db
    healthcheck:
      test: [ 'CMD', 'pg_isready', '-h', 'localhost' ]

  postgres-exporter:
    image: wrouesnel/postgres_exporter:v0.8.0
    restart: always
    environment:
      - DATA_SOURCE_URI=db:5432/db_name?sslmode=disable
      - DATA_SOURCE_USER=db_user
      - DATA_SOURCE_PASS=123456!
    ports:
      - "9187:9187"
    depends_on:
      - db

  grafana:
    image: grafana/grafana
    ports:
      - 9010:3000

  prometheus:
    image: prom/prometheus
    ports:
      - 9090:9090
#    volumes:
#      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro